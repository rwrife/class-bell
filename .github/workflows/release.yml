name: Windows release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (v*)'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-latest
    env:
      FLUTTER_VERSION: '3.47.7'
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - name: Validate release tag
        shell: pwsh
        run: |
          if ($env:RELEASE_TAG -notmatch '^v[0-9]+\.[0-9]+\.[0-9]+$') {
            throw 'Release tag must match vMAJOR.MINOR.PATCH'
          }
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          persist-credentials: false
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: flutter analyze
      - run: flutter test
      - run: flutter build windows --release
      - name: Zip portable Windows build
        shell: pwsh
        run: |
          $dir = 'build/windows/x64/runner/Release'
          if (-not (Test-Path "$dir/class_bell.exe")) { throw 'Windows executable missing' }
          Compress-Archive -Path "$dir/*" -DestinationPath "class-bell-$env:RELEASE_TAG-windows-x64.zip"
      - name: Publish GitHub release
        shell: pwsh
        run: |
          gh release create "$env:RELEASE_TAG" "class-bell-$env:RELEASE_TAG-windows-x64.zip" --title "Class Bell $env:RELEASE_TAG" --generate-notes --verify-tag
