name: class_bell
description: "Offline classroom tools for teachers: visual timer, fair picker, praise tallies, quiet signal. Local-first, no accounts, no network."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.5

dependencies:
  audioplayers: ^6.5.1
  cupertino_icons: ^2.0.0
  dynamic_color: ^1.8.0
  file_picker: ^10.3.10
  fluent_ui: ^4.16.1
  flutter:
    sdk: flutter
  path: ^1.9.1
  path_provider: ^2.1.6
  sqlite3: ^3.7.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/audio/chime.wav
